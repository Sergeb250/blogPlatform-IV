<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Platform</title>
  <style>
    /* black and white only */
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: #fff; color: #000; font: 16px/1.4 system-ui, sans-serif; }
    .card { width: 100%; max-width: 360px; padding: 32px 28px; background: #fff; border: 2px solid #000; border-radius: 12px; }
    h1 { margin: 0 0 24px; font-size: 28px; text-align: center; }
    h2 { margin: 0 0 8px; font-size: 20px; text-align: center; }
    label { display: block; margin: 0 0 14px; font-size: 14px; font-weight: 600; }
    input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; font-weight: 400;
            color: #000; background: #fff; border: 1px solid #000; border-radius: 8px; }
    input:focus { outline: 2px solid #000; outline-offset: 2px; }
    button, .google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
                      padding: 10px 12px; font: inherit; font-weight: 600; border: 1px solid #000; border-radius: 8px;
                      cursor: pointer; text-decoration: none; }
    button { color: #fff; background: #000; }
    button:disabled { color: #000; background: #fff; cursor: wait; }
    .google { color: #000; background: #fff; }
    .google:hover { text-decoration: underline; }
    .google svg { width: 20px; height: 20px; }
    .or { display: flex; align-items: center; gap: 12px; margin: 20px 0; font-size: 14px; }
    .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid #000; }
    .error { min-height: 20px; margin: 0 0 12px; font-size: 14px; font-weight: 600; }
    .error:not(:empty) { padding-left: 8px; border-left: 4px solid #000; }
    #welcome { text-align: center; }
    #welcome p { margin: 0 0 24px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Blog Platform</h1>

    <!-- shown when nobody is logged in -->
    <section id="login">
      <form id="form">
        <label>Username
          <input id="username" name="username" autocomplete="username" required autofocus>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="error" class="error" role="alert"></p>
        <button id="submit" type="submit">Sign in</button>
      </form>

      <div class="or">or</div>

      <a class="google" href="/oauth2/authorization/google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </a>
    </section>

    <!-- shown after a successful login -->
    <section id="welcome" hidden>
      <h2 id="greeting"></h2>
      <p id="email"></p>
      <button id="logout" type="button">Log out</button>
    </section>
  </main>

  <script>
    const TOKEN = 'token';
    const $ = id => document.getElementById(id);

    // Calls the API with the saved token; returns the "data" of the answer or throws an Error with the server's message.
    async function api(path, options = {}) {
      const token = sessionStorage.getItem(TOKEN);
      const response = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }) },
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        const details = body.errors ? Object.values(body.errors).join(', ') : '';
        throw new Error((body.message || 'Something went wrong') + (details ? ': ' + details : ''));
      }
      return body.data;
    }

    function showLogin() {
      $('welcome').hidden = true;
      $('login').hidden = false;
    }

    // Asks the API who the token belongs to (works for a password login and a Google login alike).
    async function showWelcome() {
      const me = await api('/api/auth/me');
      $('greeting').textContent = 'Welcome, ' + me.username;   // textContent, never innerHTML: the name is data
      $('email').textContent = me.email;
      $('login').hidden = true;
      $('welcome').hidden = false;
    }

    $('form').addEventListener('submit', async event => {
      event.preventDefault();
      $('error').textContent = '';
      $('submit').disabled = true;
      try {
        const token = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username: $('username').value, password: $('password').value }),
        });
        sessionStorage.setItem(TOKEN, token.accessToken);
        $('password').value = '';
        await showWelcome();
      } catch (error) {
        $('error').textContent = error.message;
      } finally {
        $('submit').disabled = false;
      }
    });

    $('logout').addEventListener('click', async () => {
      try { await api('/api/auth/logout', { method: 'POST' }); } catch { /* the token is dropped anyway */ }
      sessionStorage.removeItem(TOKEN);
      showLogin();
    });

    // After Google, the server sends the browser back here with the token in the #fragment (#access_token=...).
    (async function start() {
      const fromGoogle = new URLSearchParams(location.hash.slice(1)).get('access_token');
      if (fromGoogle) {
        sessionStorage.setItem(TOKEN, fromGoogle);
        history.replaceState(null, '', location.pathname);   // take the token out of the address bar
      }
      if (!sessionStorage.getItem(TOKEN)) return;
      try {
        await showWelcome();
      } catch {
        sessionStorage.removeItem(TOKEN);                    // expired, revoked or changed token: sign in again
      }
    })();
  </script>
</body>
</html>
