# Google login, on with the "google" profile: --spring.profiles.active=google
# Google Cloud console -> APIs & Services -> Credentials -> OAuth client ID (Web application),
# authorized redirect URI: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# where the browser goes after a Google login, with the token in the URL fragment (#access_token=...).
# Default: the root page (static/index.html, the sign-in page), which then shows "Welcome, <name>".
# Set OAUTH2_REDIRECT_URI to another frontend's URL; set it empty to get the token as JSON instead.
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:/}
