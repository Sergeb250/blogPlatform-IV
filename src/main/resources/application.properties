spring.application.name=blog

# local secrets (Google client, admin password, ...) from a git-ignored .env file in the project folder, when there
# is one: see .env.example. It only gives values to the ${...} variables of these files (and the default profile):
# the settings themselves live only here, in src/main/resources.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blog_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# data.sql inserts the three roles (ADMIN, AUTHOR, READER) at every start, after Hibernate has created the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# above the real limit (100, @ValidPageable), so a too-big size reaches the validator instead of being cut down
spring.data.web.pageable.max-page-size=1000

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.read.strict-duplicate-detection=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
# always the light theme: Swagger UI's top bar switches to dark mode when the OS is dark; this layout has no top bar
springdoc.swagger-ui.layout=BaseLayout

app.performance.slow-threshold-ms=300


app.jwt.secret=Eoi1zcIiBd7cpqSju9fioSueiV1cF8Qwcktg2Pac9oA=
app.jwt.expiration=${JWT_EXPIRATION:60m}
app.jwt.issuer=blog-platform

# first admin account: created at startup only while there is no admin and ADMIN_PASSWORD is set
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@blog.local}
app.admin.password=${ADMIN_PASSWORD:}

# brute-force protection: this many failed logins for one username from one IP within the window -> 429
app.security.login.max-failures=5
app.security.login.window=15m

# browser origins (frontends) allowed to call the API, comma-separated; any other origin gets 403
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# the session cookie of the /csrf-demo page and of the few seconds of a Google login (the JWT API has none).
# JavaScript can't read it, and the browser leaves it out of POSTs that start on another site: a second guard
# next to the CSRF token.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
